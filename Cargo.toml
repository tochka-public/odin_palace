[package]
name = "odin_palace"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Parser and analyzer for bank statements in the 1CClientBankExchange format"
license = "MIT"
repository = "https://github.com/tochka-public/odin_palace"
homepage = "https://github.com/tochka-public/odin_palace"
documentation = "https://docs.rs/odin_palace"
readme = "README.md"
keywords = ["1c", "bank", "statement", "parser", "finance"]
categories = ["parser-implementations", "command-line-utilities", "finance"]
exclude = [
    "src/tests/suites/**",
    "benches/**",
    "release-please-config.json",
    ".release-please-manifest.json",
]

[dependencies]
chrono = { version = "0.4", features = ["serde"], default-features = false }
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
indexmap = "2"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }


[dev-dependencies]
insta = "1"
rstest = "0.25"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "my_benchmark"
harness = false

[lints.rust]
warnings = "deny"
unreachable_pub = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
style = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
fallible_impl_from = "deny"
wildcard_enum_match_arm = "deny"
fn_params_excessive_bools = "deny"
must_use_candidate = "deny"
