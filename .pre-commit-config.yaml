# Полный локальный контроль до коммита: гигиена файлов, опечатки,
# формат, clippy со всеми включёнными lint-группами и тесты.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=600]
      - id: end-of-file-fixer
        exclude: '^src/tests/suites/|^benches/bench_statement\.txt$|\.snap$'
      - id: trailing-whitespace
        exclude: '^src/tests/suites/|^benches/bench_statement\.txt$|\.snap$'
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '^src/tests/suites/|^benches/bench_statement\.txt$|\.snap$'

  - repo: https://github.com/crate-ci/typos
    rev: v1.49.0
    hooks:
      - id: typos
        exclude: '^src/tests/suites/|^benches/bench_statement\.txt$|\.snap$'

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy (all targets, -D warnings)
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-test
        name: cargo test
        entry: cargo test
        language: system
        types: [rust]
        pass_filenames: false
